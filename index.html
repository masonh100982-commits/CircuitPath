<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>CircuitPath — In the works</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#090909;color:#f1f1f1;font-family:Arial,Helvetica,sans-serif}
    body{display:grid;place-items:center;overflow:hidden;user-select:none;pointer-events:none}
    .work-wrap{width:min(680px,calc(100% - 40px));text-align:center;padding:40px}
    .brand{font-size:18px;font-weight:700;letter-spacing:-.3px;color:#eee;margin-bottom:70px}
    .rule{width:48px;height:1px;background:#5a5a5a;margin:0 auto 28px}
    .eyebrow{font:600 11px/1.4 monospace;letter-spacing:1.6px;text-transform:uppercase;color:#a7a7a7}
    h1{font-size:clamp(34px,6vw,58px);line-height:1.05;letter-spacing:-2px;margin:16px 0 18px}
    p{max-width:520px;margin:0 auto;color:#aaa;font-size:16px;line-height:1.7}
    .status{display:inline-block;margin-top:30px;padding:9px 13px;border:1px solid #303030;border-radius:5px;color:#8f8f8f;font:12px monospace}
    .dots{margin:55px auto 0;display:flex;justify-content:center;gap:7px}
    .dots i{width:6px;height:6px;border-radius:50%;background:#555}
  </style>
</head>
<body aria-label="CircuitPath site in the works">
  <main class="work-wrap">
    <div class="brand">CircuitPath</div>
    <div class="rule"></div>
    <div class="eyebrow">Site in the works</div>
    <h1>We’re building something useful.</h1>
    <p>CircuitPath is being updated with clearer Java lessons and FTC robotics practice. This page is temporarily unavailable while the work is in progress.</p>
    <div class="status">Please check back soon</div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </main>
</body>
</html>
